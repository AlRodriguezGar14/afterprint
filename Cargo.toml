[package]
name = "afterprint"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
camino = "1"
clap = { version = "4", features = ["derive"] }
lopdf = { version = "0.44", default-features = false }
natord = "1.0.9"
printpdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tesseract = "0.15.2"
walkdir = "2"
ct2rs = "0.9.22"
